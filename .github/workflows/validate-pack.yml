name: Compilar LowMine Batata 8x

on:
  push:
    paths:
      - "tools/**"
      - "recursos/**"
      - "assets/**"
      - "README.md"
      - "CREDITOS.md"
      - "docs/**"
      - ".github/workflows/validate-pack.yml"
  pull_request:
    paths:
      - "tools/**"
      - "recursos/**"
      - "assets/**"
      - "README.md"
      - "CREDITOS.md"
      - "docs/**"
      - ".github/workflows/validate-pack.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Verificar sintaxe
        run: python -m py_compile tools/gerar_pacote.py tools/redesenhar_v061.py tools/redesenhar_v063.py tools/finalizar_pacote_v064.py tools/lowmine_batata_v065.py tools/validar_pacote_v065.py
      - name: Construir base
        run: python tools/gerar_pacote.py
      - name: Preparar versão anterior
        run: python tools/redesenhar_v061.py
      - name: Redesenhar troncos e armaduras
        run: python tools/redesenhar_v063.py
      - name: Preparar manifesto estável
        run: python tools/finalizar_pacote_v064.py
      - name: Aplicar LOW BATATA
        run: python tools/lowmine_batata_v065.py
      - name: Validar
        run: python tools/validar_pacote_v065.py build/LowMine-Batata-8x-v0.6.5.mcpack
      - uses: actions/upload-artifact@v4
        with:
          name: LowMine-Batata-8x-v0.6.5
          path: build/LowMine-Batata-8x-v0.6.5.mcpack
          if-no-files-found: error
          retention-days: 14
      - name: Publicar Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lowmine-v0.6.5
          name: LowMine Batata 8x v0.6.5
          target_commitish: main
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/LowMine-Batata-8x-v0.6.5.mcpack
