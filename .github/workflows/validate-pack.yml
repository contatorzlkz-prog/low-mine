name: Validar e compilar LowMine 8x

on:
  push:
    paths:
      - "tools/**"
      - "recursos/**"
      - "assets/**"
      - "README.md"
      - "CREDITOS.md"
      - "docs/**"
      - ".github/workflows/validate-pack.yml"
  pull_request:
    paths:
      - "tools/**"
      - "recursos/**"
      - "assets/**"
      - "README.md"
      - "CREDITOS.md"
      - "docs/**"
      - ".github/workflows/validate-pack.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Verificar sintaxe das ferramentas
        run: python -m py_compile tools/gerar_pacote.py tools/validar_pacote.py tools/redesenhar_v061.py tools/validar_pacote_v061.py tools/redesenhar_v063.py tools/validar_pacote_v063.py tools/finalizar_pacote_v064.py tools/validar_pacote_v064.py
      - name: Construir base estável 0.5.0
        run: python tools/gerar_pacote.py
      - name: Preparar versão anterior 0.6.2
        run: python tools/redesenhar_v061.py
      - name: Redesenhar LowMine 0.6.3
        run: python tools/redesenhar_v063.py
      - name: Corrigir manifesto e transparência total 0.6.4
        run: python tools/finalizar_pacote_v064.py
      - name: Validar pacote v0.6.4
        run: python tools/validar_pacote_v064.py build/LowMine-Equilibrado-8x-v0.6.4.mcpack
      - name: Publicar artefatos para teste
        uses: actions/upload-artifact@v4
        with:
          name: LowMine-Equilibrado-8x-v0.6.4
          path: build/LowMine-Equilibrado-8x-v0.6.4.mcpack
          if-no-files-found: error
          retention-days: 14
      - name: Criar Release com download permanente
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lowmine-v0.6.4
          name: LowMine Equilibrado 8x v0.6.4
          target_commitish: main
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/LowMine-Equilibrado-8x-v0.6.4.mcpack
