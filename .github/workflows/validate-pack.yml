name: Validar pacotes Bedrock

on:
  push:
    paths:
      - "**.mcpack"
      - "releases/**"
      - "tools/gerar_pacote.py"
      - "tools/validar_pacote.py"
      - ".github/workflows/validate-pack.yml"
  pull_request:
    paths:
      - "**.mcpack"
      - "releases/**"
      - "tools/gerar_pacote.py"
      - "tools/validar_pacote.py"
      - ".github/workflows/validate-pack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ferramenta de imagens
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Verificar sintaxe dos scripts
        run: python -m py_compile tools/gerar_pacote.py tools/validar_pacote.py

      - name: Validar pacotes publicados na pasta releases
        shell: bash
        run: |
          mapfile -d '' pacotes < <(find releases -type f -iname '*.mcpack' -print0)
          if (( ${#pacotes[@]} == 0 )); then
            echo "::notice::Nenhum arquivo .mcpack foi anexado à pasta releases."
            exit 0
          fi

          for pacote in "${pacotes[@]}"; do
            echo "Validando: $pacote"
            python tools/validar_pacote.py "$pacote"
          done
