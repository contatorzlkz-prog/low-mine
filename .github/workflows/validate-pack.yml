name: LowMine — compilação de recuperação
on:
  push:
    paths:
      - "tools/**"
      - "recursos/**"
      - "assets/**"
      - "README.md"
      - "CREDITOS.md"
      - "docs/**"
      - ".github/workflows/validate-pack.yml"
  pull_request:
    paths:
      - "tools/**"
      - "recursos/**"
      - "assets/**"
      - "README.md"
      - "CREDITOS.md"
      - "docs/**"
      - ".github/workflows/validate-pack.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  safe_rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Validar sintaxe
        run: python -m py_compile tools/gerar_pacote.py tools/redesenhar_v061.py tools/redesenhar_v063.py tools/finalizar_pacote_v064.py tools/restaurar_base_v066.py tools/validar_restauracao_v066.py
      - name: Construir base conhecida
        run: python tools/gerar_pacote.py
      - name: Preparar versão anterior
        run: python tools/redesenhar_v061.py
      - name: Compilar assets 0.6.4
        run: python tools/redesenhar_v063.py
      - name: Aplicar manifesto Bedrock estável
        run: python tools/finalizar_pacote_v064.py
      - name: Criar pacote de recuperação
        run: python tools/restaurar_base_v066.py
      - name: Comparar todos os assets com a base
        run: python tools/validar_restauracao_v066.py build/LowMine-Equilibrado-8x-v0.6.4.mcpack build/LowMine-Equilibrado-8x-v0.6.6.mcpack
      - uses: actions/upload-artifact@v4
        with:
          name: LowMine-Equilibrado-8x-v0.6.6
          path: build/LowMine-Equilibrado-8x-v0.6.6.mcpack
          if-no-files-found: error
          retention-days: 14
      - name: Publicar versão de recuperação
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lowmine-v0.6.6
          name: LowMine 8x v0.6.6 — recuperação
          target_commitish: main
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Versão de recuperação baseada nos arquivos da 0.6.4.
            Somente o manifesto foi atualizado para a versão 0.6.6.
            Não inclui as alterações de UI, partículas ou PBR introduzidas na 0.6.5.
            O CI compara todos os assets e exige zero diferenças fora do manifesto.
          files: |
            build/LowMine-Equilibrado-8x-v0.6.6.mcpack
